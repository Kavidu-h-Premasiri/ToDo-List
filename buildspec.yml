version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.24
      nodejs: 22
    commands:
      - echo Installing dependencies...
      - cd frontend
      - npm install
      - cd ..

  pre_build:
    commands:
      - echo Installing backend dependencies...
      - cd backend
      - go mod download
      - cd ..

  build:
    commands:
      - echo Building frontend...
      - cd frontend
      - npm run build
      - cd ..

      - echo Building backend...
      - cd backend
      - go build -o main .
      - cd ..

  post_build:
    commands:
      - echo Deploying frontend to S3...
      - aws s3 sync frontend/dist/ s3://$S3_BUCKET/ --acl public-read --delete
      - echo Deployment complete!

artifacts:
  files:
    - '**/*'
  discard-paths: yes

cache:
  paths:
    - 'frontend/node_modules/**/*'
    - '/root/.cache/go/**/*'